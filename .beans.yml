# Beans configuration — see https://github.com/hmans/beans
#
# Bean files are Markdown with YAML front matter and live in `.beans/` as
# `<prefix><id>--<slug>.md`. Only the fields documented in `.beans/template.md`
# belong in the front matter; everything else is dropped by the CLI on write.
beans:
  # Directory where bean files are stored
  path: .beans
  # Prefix for bean IDs (e.g. "holon-agentic-coder-ref-metadata-0033")
  prefix: holon-agentic-coder-ref-metadata-
  # Bean IDs MUST follow a strictly sequential 4-digit zero-padded integer format:
  # 0001, 0002, 0003, ..., 0033, 0034. Random base36 suffixes (e.g. k4t7, 1lh8)
  # are strictly forbidden. Always check existing beans and increment the highest integer.
  id_length: 4
  # Default status for new beans. Valid statuses are fixed by the CLI:
  # draft, todo, in-progress, completed, scrapped (the last two are archived
  # by `beans archive`). See the note in .agents/workflows.md.
  default_status: todo
  # Default type for new beans. Valid types: task, bug, feature, epic, milestone
  default_type: task
