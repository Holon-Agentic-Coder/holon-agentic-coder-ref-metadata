name: Test - Hygiene

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Prettier Check
        run: npx prettier --check "**/*.md"

      - name: Validate Markdown Links
        run: node .agents/scripts/validate-links.js

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Dev Dependencies
        run: uv sync --group dev

      - name: Run Ruff Lint and Format Checks
        run: |
          uv run ruff check .agents/ tests/
          uv run ruff format --check .agents/ tests/

      - name: Run Python Unit Tests
        run: uv run pytest tests/ -q
